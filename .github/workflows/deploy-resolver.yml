name: Deploy BookShelf Resolver

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate resolver
        working-directory: worker
        run: |
          node --check src/index.js
          node test/smoke.mjs

      - name: Install Wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Accept Meta vision model license (best effort)
        shell: bash
        run: |
          curl --silent --show-error --fail \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/meta/llama-3.2-11b-vision-instruct" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"prompt":"agree"}' \
            || echo "Could not accept the Meta license automatically; ISBN resolver can still deploy. See README for the one-time manual command."

      - name: Deploy resolver
        working-directory: worker
        run: npx wrangler deploy

      - name: Add optional Google Books key
        if: env.GOOGLE_BOOKS_API_KEY != ''
        working-directory: worker
        run: printf '%s' "$GOOGLE_BOOKS_API_KEY" | npx wrangler secret put GOOGLE_BOOKS_API_KEY
