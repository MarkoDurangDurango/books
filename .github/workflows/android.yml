name: Build BookShelf APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      BOOKSHELF_RESOLVER_URL: ${{ secrets.BOOKSHELF_RESOLVER_URL }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check resolver JavaScript
        run: |
          node --check worker/src/index.js
          node worker/test/smoke.mjs

      - name: Verify dependency compatibility
        shell: bash
        run: |
          set -o pipefail
          gradle :app:checkDebugAarMetadata --stacktrace --console=plain 2>&1 | tee gradle-aar-metadata.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee gradle-test.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BookShelf-build-diagnostics
          path: |
            gradle-aar-metadata.log
            gradle-test.log
            gradle-build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BookShelf-debug
          path: app/build/outputs/apk/debug/app-debug.apk
